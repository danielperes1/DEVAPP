<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DEVAPP</title>
<style>
  /* Tema claro: o padrao. O escuro entra so quando o atributo data-tema
     estiver no <html>, gravado pelo botao e lembrado no navegador. */
  :root {
    --fundo:        #eef2f7;
    --papel:        #ffffff;
    --borda:        #dbe2ec;
    --borda-forte:  #c3cede;
    --tinta:        #0f172a;
    --tinta-media:  #475569;
    --tinta-fraca:  #8492a6;
    --acento:       #0b7ec4;
    --acento-luz:   #e3f2fd;
    --ok:           #0f9d58;
    --ok-luz:       #e6f6ed;
    --aviso:        #b45309;
    --aviso-luz:    #fdf4e3;
    --aviso-borda:  #f2e3c6;
    --perigo:       #d14343;
    --perigo-luz:   #fdf0f0;
    --grade:        rgba(15,23,42,.045);
    --sutil:        #f1f5f9;
    --sutil-forte:  #cbd5e1;
    --trilho:       #e2e8f0;
    --dado-fundo:   #f6f8fb;
    --ausente:      #fbfcfe;
    --emblema-cor:  #0f172a;
    --emblema-luz:  #ffffff;
    --sombra:       0 1px 2px rgba(15,23,42,.04);
    --sombra-alta:  0 6px 18px -8px rgba(15,23,42,.28);
    --mono: ui-monospace, "Cascadia Mono", Consolas, "Courier New", monospace;
  }

  :root[data-tema="escuro"] {
    --fundo:        #0e1319;
    --papel:        #171d25;
    --borda:        #262f3a;
    --borda-forte:  #37424f;
    --tinta:        #e7edf4;
    --tinta-media:  #a3b2c2;
    --tinta-fraca:  #71818f;
    --acento:       #4fabe8;
    --acento-luz:   rgba(79,171,232,.16);
    --ok:           #46c489;
    --ok-luz:       rgba(70,196,137,.15);
    --aviso:        #e2a75e;
    --aviso-luz:    rgba(226,167,94,.13);
    --aviso-borda:  rgba(226,167,94,.28);
    --perigo:       #ec6a6a;
    --perigo-luz:   rgba(236,106,106,.13);
    --grade:        rgba(255,255,255,.032);
    --sutil:        #212a34;
    --sutil-forte:  #3f4c5a;
    --trilho:       #262f3a;
    --dado-fundo:   #1d242d;
    --ausente:      #141a21;
    --emblema-cor:  #e7edf4;
    --emblema-luz:  #0e1319;
    --sombra:       0 1px 2px rgba(0,0,0,.3);
    --sombra-alta:  0 8px 22px -10px rgba(0,0,0,.7);
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    color: var(--tinta);
    font: 15px/1.55 -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
    background-color: var(--fundo);
    background-image:
      linear-gradient(var(--grade) 1px, transparent 1px),
      linear-gradient(90deg, var(--grade) 1px, transparent 1px);
    background-size: 26px 26px;
    background-attachment: fixed;
  }

  .envelope { max-width: 1180px; margin: 0 auto; padding: 26px 20px 70px; }

  /* ---------- cabecalho ---------- */
  .capa {
    background: var(--papel);
    border: 1px solid var(--borda);
    border-radius: 16px;
    padding: 20px 24px;
    display: flex; align-items: center; gap: 18px; flex-wrap: wrap;
    box-shadow: var(--sombra);
    position: relative; overflow: hidden;
  }
  .capa::before {
    content: ""; position: absolute; inset: 0 0 auto 0; height: 3px;
    background: linear-gradient(90deg, var(--acento), #22d3ee 45%, var(--ok));
  }
  .emblema {
    width: 46px; height: 46px; border-radius: 13px; flex-shrink: 0;
    background: var(--emblema-cor); color: var(--emblema-luz); display: grid; place-items: center;
  }
  .titulo { flex: 1; min-width: 220px; }
  .titulo h1 { margin: 0; font-size: 24px; letter-spacing: -.02em; }
  .titulo .caminho {
    font-family: var(--mono); font-size: 12px; color: var(--tinta-fraca);
    word-break: break-all;
  }
  .medidor { display: flex; align-items: baseline; gap: 7px; }
  .medidor .n { font-size: 30px; font-weight: 700; letter-spacing: -.03em; }
  .medidor .de { color: var(--tinta-fraca); font-size: 13px; }
  .trilho {
    width: 150px; height: 6px; border-radius: 99px;
    background: var(--trilho); overflow: hidden; margin-top: 6px;
  }
  .trilho i { display: block; height: 100%; background: var(--ok); border-radius: 99px; }

  /* ---------- barra de filtros ---------- */
  .barra { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin: 22px 0 8px; }
  .campo { position: relative; flex: 1; min-width: 240px; }
  .campo svg { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: var(--tinta-fraca); }
  input[type=search] {
    width: 100%; font: inherit; padding: 10px 12px 10px 38px;
    border: 1px solid var(--borda-forte); border-radius: 10px;
    background: var(--papel); color: var(--tinta);
  }
  input[type=search]:focus { outline: none; border-color: var(--acento); box-shadow: 0 0 0 3px var(--acento-luz); }

  .pilula {
    display: inline-flex; align-items: center; gap: 7px; cursor: pointer;
    border: 1px solid var(--borda-forte); border-radius: 10px;
    padding: 9px 14px; background: var(--papel); font-size: 14px;
    color: var(--tinta-media); user-select: none;
  }
  .pilula:hover { border-color: var(--acento); color: var(--acento); }
  .pilula input { accent-color: var(--acento); margin: 0; }
  button.pilula { font: inherit; }
  .pilula.perigo:hover { border-color: var(--perigo); color: var(--perigo); background: var(--perigo-luz); }

  .despedida {
    background: var(--papel); border: 1px solid var(--borda); border-radius: 16px;
    padding: 46px 30px; text-align: center; max-width: 460px; margin: 90px auto;
    box-shadow: var(--sombra);
  }
  .despedida .marca {
    width: 54px; height: 54px; border-radius: 15px; margin: 0 auto 18px;
    display: grid; place-items: center; background: var(--ok-luz); color: var(--ok);
  }
  .despedida h2 { margin: 0 0 8px; font-size: 19px; letter-spacing: -.01em; }
  .despedida p { margin: 0; color: var(--tinta-media); font-size: 14px; }
  .despedida .dica {
    margin-top: 18px; padding-top: 16px; border-top: 1px solid var(--borda);
    font-family: var(--mono); font-size: 11.5px; color: var(--tinta-fraca);
  }

  /* ---------- categorias ---------- */
  .secao { margin-top: 30px; }
  .secao h2 {
    display: flex; align-items: center; gap: 10px;
    font-size: 11.5px; text-transform: uppercase; letter-spacing: .12em;
    color: var(--tinta-fraca); font-weight: 700; margin: 0 0 13px;
  }
  .secao h2::after { content: ""; flex: 1; height: 1px; background: var(--borda); }
  .contagem {
    font-family: var(--mono); letter-spacing: 0; text-transform: none;
    background: var(--papel); border: 1px solid var(--borda);
    border-radius: 6px; padding: 1px 7px; font-size: 11px;
  }

  .grade { display: grid; gap: 13px; grid-template-columns: repeat(auto-fill, minmax(310px, 1fr)); }

  /* ---------- cartao ---------- */
  .cartao {
    background: var(--papel); border: 1px solid var(--borda);
    border-radius: 14px; padding: 15px 16px;
    display: flex; flex-direction: column; gap: 11px;
    transition: border-color .15s, box-shadow .15s, transform .15s;
  }
  .cartao:hover {
    border-color: var(--marca, var(--acento));
    box-shadow: var(--sombra-alta);
    transform: translateY(-2px);
  }
  .cartao.ausente { background: var(--ausente); }
  .cartao.ausente .icone { filter: saturate(.25); opacity: .6; }
  .cartao.ausente .nome { color: var(--tinta-media); }

  .cabeca { display: flex; gap: 13px; align-items: flex-start; }
  .icone {
    width: 44px; height: 44px; flex-shrink: 0; border-radius: 12px;
    display: grid; place-items: center;
    background: var(--marca-suave, #eef2f7);
    color: var(--marca, var(--tinta-media));
    border: 1px solid var(--marca-borda, transparent);
  }
  .identidade { flex: 1; min-width: 0; }
  .nome { font-weight: 650; line-height: 1.25; }
  .versao { font-family: var(--mono); font-size: 11.5px; color: var(--tinta-fraca); margin-top: 2px; }

  .estado {
    flex-shrink: 0; display: inline-flex; align-items: center; gap: 6px;
    font-size: 11.5px; font-weight: 600; padding: 4px 10px 4px 8px; border-radius: 99px;
  }
  .estado i { width: 6px; height: 6px; border-radius: 99px; display: block; }
  .estado.sim { background: var(--ok-luz); color: var(--ok); }
  .estado.sim i { background: var(--ok); }
  .estado.nao { background: var(--sutil); color: var(--tinta-fraca); }
  .estado.nao i { background: var(--sutil-forte); }
  .estado.noar { background: var(--acento-luz); color: var(--acento); }
  .estado.noar i { background: var(--acento); animation: pulsa 1.6s ease-in-out infinite; }
  @keyframes pulsa { 50% { opacity: .25; } }

  .agir.parar { border-color: var(--perigo); color: var(--perigo); background: var(--perigo-luz); }
  .agir.parar:hover { background: var(--perigo); color: #fff; }

  .etiquetas { display: flex; flex-wrap: wrap; gap: 6px; }
  .etiqueta {
    display: inline-flex; align-items: center; gap: 5px;
    font-size: 11px; padding: 3px 8px; border-radius: 7px;
    background: var(--aviso-luz); color: var(--aviso); border: 1px solid var(--aviso-borda);
  }

  .servidor {
    display: flex; flex-wrap: wrap; gap: 6px;
    border-top: 1px dashed var(--borda); padding-top: 10px;
  }
  .dado {
    font-family: var(--mono); font-size: 11px;
    background: var(--dado-fundo); border: 1px solid var(--borda);
    border-radius: 6px; padding: 2px 7px; color: var(--tinta-media);
  }
  .dado b { color: var(--tinta); font-weight: 600; }

  /* ---------- rodape ---------- */
  footer { margin-top: 46px; }
  .links { display: flex; flex-wrap: wrap; gap: 8px; }
  .links a {
    display: inline-flex; align-items: center; gap: 7px;
    font-size: 13px; text-decoration: none; color: var(--tinta-media);
    border: 1px solid var(--borda); border-radius: 9px; padding: 7px 12px;
    background: var(--papel);
  }
  .links a:hover { border-color: var(--acento); color: var(--acento); }
  .nota { color: var(--tinta-fraca); font-size: 12.5px; margin-top: 20px; }
  .nota code { font-family: var(--mono); background: var(--papel); border: 1px solid var(--borda); border-radius: 5px; padding: 1px 5px; }

  .erro {
    background: var(--aviso-luz); border: 1px solid var(--aviso-borda); color: var(--aviso);
    padding: 16px 18px; border-radius: 12px;
  }
  .vazio { color: var(--tinta-fraca); padding: 30px 0; text-align: center; }

  .acoes { display: flex; gap: 8px; margin-top: auto; padding-top: 4px; }
  .agir {
    font: inherit; font-size: 13px; cursor: pointer;
    display: inline-flex; align-items: center; gap: 6px;
    border: 1px solid var(--marca, var(--borda-forte)); border-radius: 9px;
    padding: 6px 13px; background: var(--marca-suave, var(--papel));
    color: var(--marca, var(--tinta-media));
  }
  .agir:hover { background: var(--marca, var(--acento)); color: #fff; }
  .agir[disabled] { opacity: .55; cursor: progress; }

  .agir.baixar {
    border-color: var(--borda-forte); background: var(--papel); color: var(--tinta-media);
  }
  .agir.baixar:hover { border-color: var(--acento); background: var(--acento); color: #fff; }

  .obra { display: flex; flex-direction: column; gap: 6px; margin-top: auto; padding-top: 6px; }
  .obra .linha { display: flex; justify-content: space-between; font-size: 11.5px; color: var(--tinta-media); }
  .obra .linha b { font-weight: 600; }
  .obra .detalhe { font-family: var(--mono); font-size: 10.5px; color: var(--tinta-fraca); }
  .obra .calha { height: 6px; border-radius: 99px; background: var(--trilho); overflow: hidden; }
  .obra .calha i {
    display: block; height: 100%; border-radius: 99px;
    background: var(--marca, var(--acento)); transition: width .3s ease;
  }
  .obra.indefinido .calha i { width: 35% !important; animation: vaivem 1.1s ease-in-out infinite; }
  @keyframes vaivem { 0% { margin-left: -35%; } 100% { margin-left: 100%; } }

  .avisos {
    position: fixed; right: 18px; bottom: 18px; z-index: 50;
    display: flex; flex-direction: column; gap: 9px; max-width: 380px;
  }
  .aviso {
    display: flex; align-items: flex-start; gap: 10px;
    background: var(--papel); border: 1px solid var(--borda);
    border-left: 3px solid var(--ok); border-radius: 10px;
    padding: 11px 15px; box-shadow: var(--sombra-alta); font-size: 13.5px;
    animation: entra .18s ease-out;
  }
  .aviso.ruim { border-left-color: var(--perigo); }
  .aviso b { display: block; margin-bottom: 1px; }
  .aviso span { color: var(--tinta-media); font-size: 12.5px; }
  @keyframes entra { from { opacity: 0; transform: translateY(6px); } }
</style>
<script>
  /* Aplica o tema salvo antes da primeira pintura: sem isso, quem escolheu
     escuro veria um lampejo branco a cada carregamento da pagina. */
  (function () {
    try {
      if (localStorage.getItem('devapp-tema') === 'escuro') {
        document.documentElement.setAttribute('data-tema', 'escuro');
      }
    } catch (e) { /* navegador em modo restrito */ }
  })();
</script>
</head>

<div class="envelope">

  <div class="capa">
    <div class="emblema">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><use href="#g-raio"/></svg>
    </div>
    <div class="titulo">
      <h1>DEVAPP</h1>
      <div class="caminho" id="raiz">carregando...</div>
    </div>
    <div>
      <div class="medidor">
        <span class="n" id="conta">-</span>
        <span class="de" id="contaDe"></span>
      </div>
      <div class="trilho"><i id="trilho" style="width:0%"></i></div>
    </div>
  </div>

  <div class="barra">
    <div class="campo">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><use href="#g-lupa"/></svg>
      <input type="search" id="busca" placeholder="Filtrar por nome, categoria ou id...">
    </div>
    <label class="pilula"><input type="checkbox" id="soFaltando"> só as não instaladas</label>
    <button class="pilula" id="atualizar">Atualizar</button>
    <button class="pilula" id="terminal" title="Abre um prompt com todas as variáveis e caminhos do DEVAPP já carregados">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><use href="#g-terminal"/></svg>
      Terminal
    </button>
    <button class="pilula" id="tema" title="Alternar entre tema claro e escuro">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><use id="temaIcone" href="#g-lua"/></svg>
      <span id="temaRotulo">Escuro</span>
    </button>
    <button class="pilula perigo" id="encerrar" title="Desliga o servidor local e libera o terminal">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><use href="#g-desligar"/></svg>
      Encerrar servidor
    </button>
  </div>

  <main id="conteudo"></main>

  <section class="secao" id="secaoExt" hidden>
    <h2>Extensões do VS Code <span class="contagem" id="extResumo"></span></h2>
    <div class="grade" id="extLista"></div>
  </section>

  <div class="avisos" id="avisos"></div>

      <h2>Ferramentas online</h2>
      <div class="links" id="links"></div>
    </div>
    <p class="nota">
      Somente leitura. Esta tela ainda não instala nem executa nada &mdash; ela lê o
      <code>catalogo.json</code> e confere no disco o que já existe.
      Ícones desenhados no próprio arquivo, sem depender de internet.
    </p>
  </footer>

</div>

<script>
  // marca: cor de identidade    glifo: qual desenho do conjunto acima
  const APARENCIA = {
    'vscode':         { cor: '#0065A9', glifo: 'g-code' },
    'netbeans':       { cor: '#1B6AC6', glifo: 'marca-netbeans' },
    'android-studio': { cor: '#3DDC84', glifo: 'marca-android-studio' },
    'notepad':        { cor: '#5FA815', glifo: 'marca-notepad' },
    'jdk':            { cor: '#E76F00', glifo: 'marca-jdk' },
    'node':           { cor: '#5FA04E', glifo: 'marca-node' },
    'python':         { cor: '#3776AB', glifo: 'marca-python' },
    'dotnet':         { cor: '#512BD4', glifo: 'marca-dotnet' },
    'flutter':        { cor: '#027DFD', glifo: 'marca-flutter' },
    'android-sdk':    { cor: '#2E9E63', glifo: 'marca-android-sdk' },
    'maven':          { cor: '#C71A36', glifo: 'marca-maven' },
    'gradle':         { cor: '#0B5566', glifo: 'marca-gradle' },
    'git':            { cor: '#F05033', glifo: 'marca-git' },
    'mysql':          { cor: '#00758F', glifo: 'marca-mysql' },
    'mysql-workbench':{ cor: '#00758F', glifo: 'marca-mysql' },
    'usbwebserver':   { cor: '#C1440E', glifo: 'g-servidor' },
    'mariadb':        { cor: '#1C5C6E', glifo: 'marca-mariadb' },
    'postgres':       { cor: '#336791', glifo: 'marca-postgres' },
    'mongodb':        { cor: '#47A248', glifo: 'marca-mongodb' },
    'neo4j':          { cor: '#018BFF', glifo: 'marca-neo4j' },
    'dbeaver':        { cor: '#7B4B2A', glifo: 'marca-dbeaver' },
    'mongosh':        { cor: '#116149', glifo: 'marca-mongosh' },
    'postman':        { cor: '#FF6C37', glifo: 'marca-postman' },
    'insomnia':       { cor: '#5849BE', glifo: 'marca-insomnia' },
    'putty':          { cor: '#475569', glifo: 'g-terminal' },
    'yed':            { cor: '#E8792B', glifo: 'g-grafo' }
  };
  const PADRAO = { cor: '#64748B', glifo: 'g-blocos' };

  const $ = (id) => document.getElementById(id);
  const chave = new URLSearchParams(location.search).get('t') || '';
  let dados = null;

  // ---------- tema ----------
  const escuro = () => document.documentElement.getAttribute('data-tema') === 'escuro';

  function aplicarTema(nome) {
    if (nome === 'escuro') document.documentElement.setAttribute('data-tema', 'escuro');
    else document.documentElement.removeAttribute('data-tema');
    try { localStorage.setItem('devapp-tema', nome); } catch (e) { /* modo restrito */ }
    // O botao anuncia o destino, nao o estado atual.
    $('temaRotulo').textContent = (nome === 'escuro') ? 'Claro' : 'Escuro';
    $('temaIcone').setAttribute('href', (nome === 'escuro') ? '#g-sol' : '#g-lua');
    if (dados) desenhar();   // as cores de marca mudam junto
  }

  // ---------- cor ----------
  function canais(hex) {
    const n = parseInt(hex.slice(1), 16);
    return [(n >> 16) & 255, (n >> 8) & 255, n & 255];
  }
  function clarear(c, fator) {
    return c.map(v => Math.round(v + (255 - v) * fator));
  }
  const solido = (c) => 'rgb(' + c.join(',') + ')';
  const comAlfa = (c, a) => 'rgba(' + c.join(',') + ',' + a + ')';

  // Dois tipos de desenho convivem aqui, distinguidos pelo prefixo do id:
  //   marca-*  logos oficiais (Simple Icons, CC0): formas preenchidas
  //   g-*      desenhos feitos neste arquivo: formas tracadas
  // Os logos ocupam a moldura inteira, entao entram um pouco menores para
  // ficarem com o mesmo peso visual dos tracados.
  function svg(glifo, tamanho) {
    const marca = glifo.indexOf('marca-') === 0;
    const lado = marca ? Math.round(tamanho * 0.87) : tamanho;
    const pintura = marca
      ? 'fill="currentColor" stroke="none"'
      : 'fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"';
    return '<svg width="' + lado + '" height="' + lado + '" viewBox="0 0 24 24" ' + pintura + '>' +
           '<use href="#' + glifo + '"/></svg>';
  }

  async function carregar() {
    try {
      const r = await fetch('/api/status?t=' + encodeURIComponent(chave), { cache: 'no-store' });
      if (!r.ok) throw new Error('HTTP ' + r.status);
      dados = await r.json();
      desenhar();
    } catch (e) {
      $('conteudo').innerHTML =
        '<div class="erro"><strong>Não consegui falar com o servidor local.</strong><br>' +
        'Confira se a janela do terminal que iniciou o DEVAPP continua aberta.<br>' +
        '<small>' + e.message + '</small></div>';
    }
  }

  function desenhar() {
    $('raiz').textContent = dados.raiz;

    const todas = dados.ferramentas;
    const prontas = todas.filter(f => f.Instalada).length;
    $('conta').textContent = prontas;
    $('contaDe').textContent = 'de ' + todas.length + ' instaladas';
    $('trilho').style.width = (todas.length ? (prontas / todas.length * 100) : 0) + '%';

    const termo = $('busca').value.trim().toLowerCase();
    const soFaltando = $('soFaltando').checked;

    const visiveis = todas.filter(f => {
      if (soFaltando && f.Instalada) return false;
      if (!termo) return true;
      return (f.Nome + ' ' + f.Categoria + ' ' + f.Id).toLowerCase().includes(termo);
    });

    const alvo = $('conteudo');
    alvo.innerHTML = '';

    if (!visiveis.length) {
      alvo.innerHTML = '<p class="vazio">Nada corresponde ao filtro.</p>';
      return;
    }

    for (const cat of [...new Set(visiveis.map(f => f.Categoria))]) {
      const doGrupo = visiveis.filter(x => x.Categoria === cat);
      const prontasGrupo = doGrupo.filter(x => x.Instalada).length;

      const secao = document.createElement('section');
      secao.className = 'secao';
      secao.innerHTML = '<h2>' + cat + ' <span class="contagem">' + prontasGrupo + '/' + doGrupo.length + '</span></h2>';

      const grade = document.createElement('div');
      grade.className = 'grade';
      doGrupo.forEach(f => grade.appendChild(cartao(f)));
      secao.appendChild(grade);
      alvo.appendChild(secao);
    }

    desenharExtensoes();

    const links = $('links');
    links.innerHTML = '';
    for (const l of dados.links) {
      const a = document.createElement('a');
      a.href = l.url; a.target = '_blank'; a.rel = 'noopener';
      a.innerHTML = svg('g-grafo', 14) + '<span>' + l.nome + '</span>';
      links.appendChild(a);
    }
  }

  function cartao(f) {
    const visual = APARENCIA[f.Id] || PADRAO;

    const div = document.createElement('div');
    div.className = 'cartao' + (f.Instalada ? '' : ' ausente');

    // Varias marcas sao escuras de origem (Gradle, MariaDB, DBeaver) e somem
    // contra o fundo escuro. No tema escuro elas sao clareadas.
    const noite = escuro();
    const cor = noite ? clarear(canais(visual.cor), .42) : canais(visual.cor);
    div.style.setProperty('--marca', solido(cor));
    div.style.setProperty('--marca-suave', comAlfa(cor, noite ? .16 : .11));
    div.style.setProperty('--marca-borda', comAlfa(cor, noite ? .3 : .22));

    let html =
      '<div class="cabeca">' +
        '<div class="icone">' + svg(visual.glifo, 23) + '</div>' +
        '<div class="identidade">' +
          '<div class="nome">' + f.Nome + '</div>' +
          '<div class="versao">' + f.Versao + '</div>' +
        '</div>' +
        '<span class="estado ' + (f.Rodando ? 'noar' : (f.Instalada ? 'sim' : 'nao')) + '"><i></i>' +
          (f.Rodando ? 'no ar' : (f.Instalada ? 'instalado' : 'ausente')) +
        '</span>' +
      '</div>';

    const avisos = [];
    if (!f.Portatil)     avisos.push('não portátil');
    if (f.Inferida)      avisos.push('detecção inferida');
    if (!f.Implementada) avisos.push('sem rotina');
    if (f.PerfilUsuario) avisos.push('escreve no seu perfil');

    // Dependências que ainda faltam: instalar esta ferramenta puxa elas junto.
    const pendentes = faltaAntes(f);
    if (pendentes.length && !f.Instalada) {
      avisos.push('vem com ' + pendentes.map(x => x.Nome).join(' e '));
    }

    if (avisos.length) {
      html += '<div class="etiquetas">' +
        avisos.map(a => '<span class="etiqueta">' + a + '</span>').join('') +
        '</div>';
    }

    if (f.Servidor) {
      const s = f.Servidor;
      const dados = ['<span class="dado">porta <b>' + s.porta + '</b></span>'];
      if (s.usuario) dados.push('<span class="dado">usuário <b>' + s.usuario + '</b></span>');
      if (s.senha) dados.push('<span class="dado">senha <b>' + s.senha + '</b></span>');
      else if (s.usuario) dados.push('<span class="dado">sem senha</span>');
      html += '<div class="servidor">' + dados.join('') + '</div>';
    }

    const ehBanco   = !!f.Servidor;
    const podeAbrir = f.Instalada && f.Executar && !ehBanco;
    const podeBaixar = !f.Instalada && f.Instalavel;
    const podeSubir = f.Instalada && ehBanco && !f.Rodando;
    const podeParar = f.Instalada && ehBanco && f.Rodando;

    if (podeAbrir || podeBaixar || podeSubir || podeParar) {
      html += '<div class="acoes">';
      if (podeAbrir)  html += '<button class="agir tocar">' + svg('g-tocar', 13) + 'Executar</button>';
      if (podeSubir)  html += '<button class="agir subir">' + svg('g-tocar', 13) + 'Iniciar</button>';
      if (podeParar)  html += '<button class="agir parar">' + svg('g-desligar', 13) + 'Parar</button>';
      if (podeBaixar) html += '<button class="agir baixar">' + svg('g-baixar', 13) + 'Instalar</button>';
      html += '</div>';
    }

    div.innerHTML = html;

    const bTocar = div.querySelector('.agir.tocar');
    if (bTocar) bTocar.addEventListener('click', (ev) => executar(f, ev.currentTarget));

    const bBaixar = div.querySelector('.agir.baixar');
    if (bBaixar) bBaixar.addEventListener('click', () => instalar(f, div));

    const bSubir = div.querySelector('.agir.subir');
    if (bSubir) bSubir.addEventListener('click', (ev) => mandarBanco(f, 'iniciar', ev.currentTarget));

    const bParar = div.querySelector('.agir.parar');
    if (bParar) bParar.addEventListener('click', (ev) => mandarBanco(f, 'parar', ev.currentTarget));

    return div;
  }

  // ---------- extensões do VS Code ----------
  function desenharExtensoes() {
    const secao = $('secaoExt');
    const cats = dados.extensoes || [];
    const vscode = dados.ferramentas.find(x => x.Id === 'vscode');

    if (!cats.length) { secao.hidden = true; return; }
    secao.hidden = false;

    const total = cats.reduce((s, c) => s + c.Total, 0);
    const prontas = cats.reduce((s, c) => s + c.Instaladas, 0);
    $('extResumo').textContent = prontas + '/' + total;

    const alvo = $('extLista');
    alvo.innerHTML = '';

    if (vscode && !vscode.Instalada) {
      alvo.innerHTML = '<p class="vazio">Instale o Visual Studio Code para gerenciar as extensões por aqui.</p>';
      return;
    }

    for (const c of cats) {
      const completa = c.Instaladas === c.Total;
      const div = document.createElement('div');
      div.className = 'cartao';
      div.style.setProperty('--marca', '#0065A9');
      div.style.setProperty('--marca-suave', 'rgba(0,101,169,.11)');

      let html =
        '<div class="cabeca">' +
          '<div class="icone">' + svg('g-code', 23) + '</div>' +
          '<div class="identidade"><div class="nome">' + c.Nome + '</div>' +
          '<div class="versao">' + c.Instaladas + ' de ' + c.Total + ' instaladas</div></div>' +
          '<span class="estado ' + (completa ? 'sim' : 'nao') + '"><i></i>' +
            (completa ? 'completa' : (c.Total - c.Instaladas) + ' faltando') +
          '</span>' +
        '</div>' +
        '<div class="obra" style="margin-top:0"><div class="calha"><i style="width:' +
          Math.round(c.Instaladas / c.Total * 100) + '%"></i></div></div>';

      if (!completa) {
        html += '<div class="acoes"><button class="agir baixar">' + svg('g-baixar', 13) +
                'Instalar ' + (c.Total - c.Instaladas) + ' faltantes</button></div>';
      }

      div.innerHTML = html;
      const b = div.querySelector('.agir');
      if (b) b.addEventListener('click', () => instalarExtensoes(c, div, b));
      alvo.appendChild(div);
    }
  }

  async function instalarExtensoes(c, cartao, botao) {
    if (emObra) { avisar('Uma instalação já está em andamento', 'Espere ela terminar.', true); return; }
    emObra = c.Id;
    botao.disabled = true;
    pintarObra(cartao, 'iniciando', -1, c.Nome, 1, 1);

    try {
      const r = await fetch('/api/extensoes?t=' + encodeURIComponent(chave) + '&categoria=' + encodeURIComponent(c.Id),
                            { method: 'POST' });
      const corpo = await r.json();
      if (!r.ok) throw new Error(corpo.erro || ('HTTP ' + r.status));
    } catch (e) {
      emObra = null;
      avisar('Não consegui iniciar', e.message, true);
      desenhar();
      return;
    }

    const relogio = setInterval(async () => {
      let p;
      try {
        const resp = await fetch('/api/progresso?t=' + encodeURIComponent(chave), { cache: 'no-store' });
        p = await resp.json();
      } catch (e) { return; }

      pintarObra(cartao, p.etapa || 'trabalhando', (p.porcento === undefined ? -1 : p.porcento), p.detalhe, 1, 1);

      if (p.fim) {
        clearInterval(relogio);
        emObra = null;
        if (p.erro) avisar('Falhou em ' + c.Nome, p.erro, true);
        else avisar('Extensões de ' + c.Nome, p.detalhe || 'Concluído.', false);
        carregar();
      }
    }, 900);
  }

  async function mandarBanco(f, acao, botao) {
    const rotulo = botao.innerHTML;
    botao.disabled = true;
    botao.innerHTML = svg(acao === 'iniciar' ? 'g-tocar' : 'g-desligar', 13) +
                      (acao === 'iniciar' ? 'Subindo...' : 'Parando...');
    try {
      const r = await fetch('/api/banco/' + acao + '?t=' + encodeURIComponent(chave) + '&id=' + encodeURIComponent(f.Id),
                            { method: 'POST' });
      const corpo = await r.json();
      if (r.ok) {
        if (acao === 'iniciar') {
          avisar(f.Nome + ' no ar', 'Porta ' + f.Servidor.porta + ', processo ' + corpo.pid + '.', false);
        } else {
          avisar(f.Nome + ' parado', corpo.modo === 'encerrado a forca'
            ? 'Não respondeu ao comando de parada e foi encerrado à força.'
            : 'Encerrado pelo comando próprio, sem risco para os dados.', false);
        }
      } else {
        avisar('Não consegui ' + acao + ' ' + f.Nome, corpo.erro || ('HTTP ' + r.status), true);
      }
    } catch (e) {
      avisar('Falha ao falar com o servidor', e.message, true);
    }
    botao.disabled = false;
    botao.innerHTML = rotulo;
    carregar();
  }

  // ---------- instalacao ----------
  let emObra = null;   // id da ferramenta sendo instalada

  // Dependências declaradas no catálogo que ainda não estão no disco.
  function faltaAntes(f) {
    if (!f.Requer || !dados) return [];
    return f.Requer
      .map(id => dados.ferramentas.find(x => x.Id === id))
      .filter(x => x && !x.Instalada);
  }

  function pintarObra(cartao, etapa, porcento, detalhe, passo, total) {
    let caixa = cartao.querySelector('.obra');
    if (!caixa) {
      const acoes = cartao.querySelector('.acoes');
      if (acoes) acoes.remove();
      caixa = document.createElement('div');
      caixa.className = 'obra';
      caixa.innerHTML = '<div class="linha"><b class="etapa"></b><span class="pct"></span></div>' +
                        '<div class="calha"><i></i></div>' +
                        '<div class="detalhe"></div>';
      cartao.appendChild(caixa);
    }
    const indefinido = !(porcento >= 0);
    caixa.classList.toggle('indefinido', indefinido);
    const fila = (total > 1) ? (passo + '/' + total + '  ') : '';
    caixa.querySelector('.etapa').textContent = fila + etapa;
    caixa.querySelector('.pct').textContent = indefinido ? '' : porcento + '%';
    caixa.querySelector('.calha i').style.width = (indefinido ? 35 : porcento) + '%';
    caixa.querySelector('.detalhe').textContent = detalhe || '';
  }

  async function instalar(f, cartao) {
    if (emObra) { avisar('Uma instalação já está em andamento', 'Espere ela terminar.', true); return; }

    // A etiqueta laranja no cartão é fácil de não ver na hora de clicar.
    if (!f.Portatil) {
      const aviso =
        f.Nome + ' não é portátil.\n\n' +
        'A instalação sai da pasta do DEVAPP: mexe no registro do Windows e ' +
        'cria entrada em Adicionar/Remover Programas. Copiar a pasta para ' +
        'outro computador não vai levar esta ferramenta junto.\n\n' +
        'Instalar mesmo assim?';
      if (!confirm(aviso)) return;
    }

    emObra = f.Id;
    const juntos = faltaAntes(f);
    pintarObra(cartao, 'iniciando', -1,
               juntos.length ? ('junto com ' + juntos.map(x => x.Nome).join(', ')) : f.Nome,
               1, juntos.length + 1);

    try {
      const r = await fetch('/api/instalar?t=' + encodeURIComponent(chave) + '&id=' + encodeURIComponent(f.Id),
                            { method: 'POST' });
      const corpo = await r.json();
      if (!r.ok) throw new Error(corpo.erro || ('HTTP ' + r.status));
    } catch (e) {
      emObra = null;
      avisar('Não consegui iniciar a instalação de ' + f.Nome, e.message, true);
      desenhar();
      return;
    }

    // O servidor respondeu na hora; quem baixa é o processo ajudante.
    // Daqui em diante a página só pergunta como vai indo.
    const relogio = setInterval(async () => {
      let p;
      try {
        const r = await fetch('/api/progresso?t=' + encodeURIComponent(chave), { cache: 'no-store' });
        p = await r.json();
      } catch (e) { return; }   // servidor ocupado num instante: tenta de novo

      pintarObra(cartao, p.etapa || 'trabalhando', (p.porcento === undefined ? -1 : p.porcento),
                 p.detalhe, p.passo, p.total);

      if (p.fim) {
        clearInterval(relogio);
        emObra = null;
        if (p.erro) avisar('Falhou ao instalar ' + f.Nome, p.erro, true);
        else avisar(f.Nome + ' instalado', 'Já pode executar por aqui.', false);
        carregar();
      }
    }, 800);
  }

  function avisar(titulo, detalhe, ruim) {
    const el = document.createElement('div');
    el.className = 'aviso' + (ruim ? ' ruim' : '');
    el.innerHTML = svg(ruim ? 'g-desligar' : 'g-certo', 17) +
                   '<div><b>' + titulo + '</b><span>' + (detalhe || '') + '</span></div>';
    $('avisos').appendChild(el);
    setTimeout(() => el.remove(), ruim ? 9000 : 4500);
  }

  async function executar(f, botao) {
    botao.disabled = true;
    const rotuloOriginal = botao.innerHTML;
    botao.innerHTML = svg('g-tocar', 13) + 'Abrindo...';
    try {
      const r = await fetch('/api/executar?t=' + encodeURIComponent(chave) + '&id=' + encodeURIComponent(f.Id),
                            { method: 'POST' });
      const corpo = await r.json();
      if (r.ok) avisar(f.Nome + ' foi aberto', 'Rodando com o ambiente do DEVAPP.', false);
      else avisar('Não consegui abrir ' + f.Nome, corpo.erro || ('HTTP ' + r.status), true);
    } catch (e) {
      avisar('Falha ao falar com o servidor', e.message, true);
    }
    botao.disabled = false;
    botao.innerHTML = rotuloOriginal;
  }

  async function encerrar() {
    if (!confirm('Encerrar o servidor do DEVAPP?\n\nA página para de funcionar e o terminal fica livre.')) return;
    try {
      // A conexão pode cair antes da resposta chegar, justamente porque o
      // servidor desliga. Nos dois casos o resultado é o mesmo: acabou.
      await fetch('/api/sair?t=' + encodeURIComponent(chave), { method: 'POST' });
    } catch (e) { /* esperado */ }

    document.querySelector('.envelope').innerHTML =
      '<div class="despedida">' +
        '<div class="marca">' +
          '<svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" ' +
          'stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><use href="#g-certo"/></svg>' +
        '</div>' +
        '<h2>Servidor encerrado</h2>' +
        '<p>Pode fechar esta aba. O terminal já está livre.</p>' +
        '<div class="dica">devapp.ps1 -Acao servir</div>' +
      '</div>';
    document.title = 'DEVAPP — encerrado';
  }

  $('busca').addEventListener('input', () => { if (dados) desenhar(); });
  $('soFaltando').addEventListener('change', () => { if (dados) desenhar(); });
  $('atualizar').addEventListener('click', carregar);
  $('encerrar').addEventListener('click', encerrar);
  $('tema').addEventListener('click', () => aplicarTema(escuro() ? 'claro' : 'escuro'));
  $('terminal').addEventListener('click', async () => {
    try {
      const r = await fetch('/api/terminal?t=' + encodeURIComponent(chave), { method: 'POST' });
      if (r.ok) avisar('Terminal aberto', 'Com o ambiente do DEVAPP já carregado.', false);
      else avisar('Não consegui abrir o terminal', 'HTTP ' + r.status, true);
    } catch (e) { avisar('Falha ao falar com o servidor', e.message, true); }
  });

  // Acerta rotulo e icone com o tema que o script do <head> ja aplicou.
  aplicarTema(escuro() ? 'escuro' : 'claro');
  carregar();
</script>
</body>
</html>
